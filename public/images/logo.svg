<svg width="220" height="220" viewBox="0 0 220 220" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Capacity Tracker Logo (Dark)">

    <style>
        /* Frame */
        .frame {
            stroke: #60A5FA; /* light blue for dark bg */
            stroke-width: 10;
            fill: none;
            transition: stroke 0.3s ease;
        }

        /* Bars */
        .bar {
            transform-origin: bottom;
            transition: transform 0.35s ease, fill 0.35s ease;
        }

        /* Hover / focus interaction */
        svg:hover .frame,
        svg:focus .frame {
            stroke: #93C5FD;
        }

        svg:hover .bar-1 { transform: scaleY(1.05); fill: #22C55E; }
        svg:hover .bar-2 { transform: scaleY(1.1);  fill: #60A5FA; }
        svg:hover .bar-3 { transform: scaleY(1.15); fill: #818CF8; }

        /* Accessibility */
        svg:focus {
            outline: none;
        }
    </style>

    <!-- Outer Frame -->
    <rect x="30" y="30" width="160" height="160" rx="26" class="frame"></rect>

    <!-- Resource Bars -->
    <rect x="72" y="108" width="20" height="52" rx="5" fill="#16A34A" class="bar bar-1"></rect>

    <rect x="100" y="82" width="20" height="78" rx="5" fill="#3B82F6" class="bar bar-2"></rect>

    <rect x="128" y="58" width="20" height="102" rx="5" fill="#6366F1" class="bar bar-3"></rect>

</svg>
