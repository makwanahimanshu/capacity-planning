<svg
    width="220"
    height="220"
    viewBox="0 0 220 220"
    xmlns="http://www.w3.org/2000/svg"
    role="img"
    aria-label="Capacity Tracker Logo">

    <style>
        /* Frame */
        .frame {
            stroke: #1E40AF;
            stroke-width: 10;
            fill: none;
            transition: stroke 0.3s ease;
        }

        /* Bars */
        .bar {
            transform-origin: bottom;
            transition: transform 0.35s ease, fill 0.35s ease;
        }

        /* Hover / focus interaction */
        svg:hover .frame,
        svg:focus .frame {
            stroke: #2563EB;
        }

        svg:hover .bar-1 { transform: scaleY(1.05); fill: #16A34A; }
        svg:hover .bar-2 { transform: scaleY(1.1);  fill: #2563EB; }
        svg:hover .bar-3 { transform: scaleY(1.15); fill: #4F46E5; }

        /* Accessibility */
        svg:focus {
            outline: none;
        }
    </style>

    <!-- Outer Frame -->
    <rect
        x="30"
        y="30"
        width="160"
        height="160"
        rx="26"
        class="frame" />

    <!-- Resource Bars -->
    <rect
        x="72"
        y="108"
        width="20"
        height="52"
        rx="5"
        fill="#22C55E"
        class="bar bar-1" />

    <rect
        x="100"
        y="82"
        width="20"
        height="78"
        rx="5"
        fill="#3B82F6"
        class="bar bar-2" />

    <rect
        x="128"
        y="58"
        width="20"
        height="102"
        rx="5"
        fill="#6366F1"
        class="bar bar-3" />

</svg>